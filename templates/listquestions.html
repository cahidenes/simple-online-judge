<html>
	<head>
		<title>İşte İsar</title>
		<link rel="stylesheet" type="text/css" href="/static/mystyle.css">
		<style>
			.toolbar { padding: 20px 30px 0 30px; display: flex; gap: 10px; align-items: flex-start; }
			.toolbar input[type="text"] { width: 100%; font-size: 18px; padding: 10px; }
			#tagbar { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
			#tagbar:empty { display: none; }
			.tagpill { border: 2px solid #112D4E; border-radius: 20px; padding: 2px 12px; font-size: 14px; cursor: pointer; background: #DBE2EF; font-family: monospace; }
			.tagpill.active { background: #112D4E; color: #fff; }
			#orderstatus { font-size: 14px; font-family: monospace; margin-top: 8px; }
			#orderstatus:empty { display: none; }
			#qlist { display: flex; flex-direction: column; padding: 10px 30px 30px 30px; }
			.section-group { display: flex; flex-direction: column; }
			.section-header { width: 100%; margin-top: 12px; padding: 6px 12px; box-sizing: border-box; font-size: 18px; cursor: pointer; display: flex; align-items: center; gap: 8px; background-color: #112D4E; border-color: #112D4E; color: #fff; }
			.section-header.dragover { border-color: #44CF6C; }
			.collapse-arrow { font-size: 14px; user-select: none; }
			.section-group.collapsed .item-row { display: none; }
			.item-row { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 6px; padding: 6px 12px; box-sizing: border-box; }
			.item-row.dragging { opacity: 0.5; }
			.item-row.dragover { border-color: #44CF6C; }
			.drag-handle { cursor: grab; font-size: 18px; user-select: none; padding: 0 5px; }
			.item-main { flex: 1; min-width: 0; }
			.item-title { font-size: 16px; font-weight: bold; }
			.item-tags { font-size: 12px; font-family: monospace; color: #112D4E; margin-left: auto; text-align: right; white-space: nowrap; }
			.item-actions { display: flex; gap: 8px; }
			.item-actions .button { font-size: 13px; margin-top: 0; padding: 6px 10px; }
		</style>
	</head>
	<body>
	<div class="topnav">
		<a href="/">Home</a>
		<a href="/resources">Resources</a>
		<a href="/listresources">Edit Resources</a>
		<a class="active" href="/listquestions">Questions</a>
		<a href="/listusers">Users</a>
		<a href="/listsections">Sections</a>
		<a href="/files">Files</a>
		<a href="/scoreboard">Scoreboard</a>
		<a class="right" href="/login">{{current_user}}</a>
	</div>
	<div class="toolbar">
		<div class="round" style="padding: 10px 15px; flex: 1;">
			<input type="text" id="search" placeholder="Search questions (title, tags)...">
			<div id="tagbar"></div>
			<div id="orderstatus"></div>
		</div>
		<div class="button" style="width: 200px; flex-shrink: 0;" onclick="window.location.href = 'addquestion'">Add Question</div>
	</div>
	<div id="qlist">
<!-- question -->
		<div class="round item-row" draggable="true" data-id="{{id}}" data-section="{{section_id}}" data-tags="{{tags_attr}}">
			<span class="drag-handle" title="Drag to reorder">☰</span>
			<div class="item-main">
				<div class="item-title">{{title}}</div>
			</div>
			<div class="item-tags">{{tags}}</div>
			<div class="item-actions">
				<div class="button" onclick="editQuestion('{{id}}')">Edit</div>
				<div class="button" onclick="deleteQuestion('{{title}}', '{{id}}')">Delete</div>
			</div>
		</div>
<!-- question end -->
	</div>
	</body>
	<script>
		function editQuestion(id) {
			window.location.href = "editquestion/" + id;
		}

		function deleteQuestion(title, id) {
			if (confirm("Are you sure you want to delete " + title + "?")) {
				fetch("/deletequestion/" + id, {
					method: "POST",
					headers: {
						"Content-Type": "application/json"
					},
					body: JSON.stringify({
						id: id
					})
				}).then(response => {
					window.location.href = "/listquestions";
				})
			}
		}

		var list = document.getElementById("qlist");
		var searchInput = document.getElementById("search");
		var tagbar = document.getElementById("tagbar");
		var status = document.getElementById("orderstatus");
		var activeTag = "";
		var dragged = null;
		var startSnapshot = null;

		function snapshot() {
			var parts = [];
			list.querySelectorAll(".section-group").forEach(function(group) {
				var sid = group.getAttribute("data-section-id");
				group.querySelectorAll(".item-row").forEach(function(row) {
					parts.push(sid + ":" + row.getAttribute("data-id"));
				});
			});
			return parts.join("|");
		}

		function applyFilter() {
			var q = searchInput.value.toLowerCase();
			var rows = list.querySelectorAll(".item-row");
			rows.forEach(function(row) {
				var tags = (row.getAttribute("data-tags") || "").toLowerCase();
				var tagOk = !activeTag || tags.split(",").map(function(t) { return t.trim(); }).indexOf(activeTag) !== -1;
				var textOk = !q || row.innerText.toLowerCase().indexOf(q) !== -1;
				row.style.display = (tagOk && textOk) ? "" : "none";
			});
			list.querySelectorAll(".section-group").forEach(function(group) {
				var visible = 0;
				group.querySelectorAll(".item-row").forEach(function(row) {
					if (row.style.display !== "none") visible++;
				});
				var header = group.querySelector(".section-header");
				if (header) header.style.display = visible ? "" : "none";
			});
			var filtering = q || activeTag;
			list.querySelectorAll(".item-row").forEach(function(row) {
				row.draggable = !filtering;
			});
		}

		function buildTagbar() {
			var tagset = {};
			list.querySelectorAll(".item-row").forEach(function(row) {
				(row.getAttribute("data-tags") || "").split(",").forEach(function(t) {
					t = t.trim();
					if (t) tagset[t.toLowerCase()] = t;
				});
			});
			tagbar.innerHTML = "";
			Object.keys(tagset).sort().forEach(function(key) {
				var pill = document.createElement("span");
				pill.className = "tagpill";
				pill.innerText = tagset[key];
				pill.onclick = function() {
					if (activeTag === key) {
						activeTag = "";
						pill.classList.remove("active");
					} else {
						activeTag = key;
						tagbar.querySelectorAll(".tagpill").forEach(function(p) { p.classList.remove("active"); });
						pill.classList.add("active");
					}
					applyFilter();
				};
				tagbar.appendChild(pill);
			});
		}

		searchInput.addEventListener("input", applyFilter);

		var collapsedKey = "collapsedSections";
		function getCollapsed() {
			try { return JSON.parse(localStorage.getItem(collapsedKey) || "[]"); } catch (e) { return []; }
		}
		function setCollapsed(ids) {
			try { localStorage.setItem(collapsedKey, JSON.stringify(ids)); } catch (e) {}
		}
		function applyCollapsed() {
			var ids = getCollapsed();
			list.querySelectorAll(".section-group").forEach(function(group) {
				var sid = group.getAttribute("data-section-id");
				var collapsed = ids.indexOf(sid) !== -1;
				group.classList.toggle("collapsed", collapsed);
				var arrow = group.querySelector(".collapse-arrow");
				if (arrow) arrow.innerText = collapsed ? "▶" : "▼";
			});
		}
		list.querySelectorAll(".section-header").forEach(function(header) {
			header.addEventListener("click", function() {
				var group = header.parentNode;
				var sid = group.getAttribute("data-section-id");
				var ids = getCollapsed();
				var i = ids.indexOf(sid);
				if (i === -1) ids.push(sid); else ids.splice(i, 1);
				setCollapsed(ids);
				applyCollapsed();
			});
		});

		function attachRowEvents(row) {
			row.addEventListener("dragstart", function(e) {
				if (!row.draggable) { e.preventDefault(); return; }
				dragged = row;
				startSnapshot = snapshot();
				row.classList.add("dragging");
				e.dataTransfer.effectAllowed = "move";
				try { e.dataTransfer.setData("text/plain", row.getAttribute("data-id")); } catch (err) {}
			});
			row.addEventListener("dragend", function() {
				row.classList.remove("dragging");
				list.querySelectorAll(".item-row, .section-header").forEach(function(r) { r.classList.remove("dragover"); });
				if (dragged === row && startSnapshot !== null && snapshot() !== startSnapshot) {
					syncSectionAttrs();
					saveOrder();
				}
				if (dragged === row) { dragged = null; startSnapshot = null; }
			});
			row.addEventListener("dragover", function(e) {
				if (!dragged || dragged === row) return;
				e.preventDefault();
				row.classList.add("dragover");
				var rect = row.getBoundingClientRect();
				var after = (e.clientY - rect.top) > rect.height / 2;
				if (after) {
					row.parentNode.insertBefore(dragged, row.nextSibling);
				} else {
					row.parentNode.insertBefore(dragged, row);
				}
			});
			row.addEventListener("dragleave", function() {
				row.classList.remove("dragover");
			});
			row.addEventListener("drop", function(e) {
				e.preventDefault();
				e.stopPropagation();
				row.classList.remove("dragover");
			});
		}

		list.querySelectorAll(".item-row").forEach(attachRowEvents);

		list.querySelectorAll(".section-group").forEach(function(group) {
			group.addEventListener("dragover", function(e) {
				if (!dragged) return;
				if (dragged.parentNode === group && group.querySelectorAll(".item-row").length) return;
				e.preventDefault();
			});
			group.addEventListener("drop", function(e) {
				if (!dragged) return;
				e.preventDefault();
				group.appendChild(dragged);
			});
			var header = group.querySelector(".section-header");
			if (header) {
				header.addEventListener("dragover", function(e) {
					if (!dragged) return;
					e.preventDefault();
					e.stopPropagation();
					header.classList.add("dragover");
				});
				header.addEventListener("dragleave", function() {
					header.classList.remove("dragover");
				});
				header.addEventListener("drop", function(e) {
					if (!dragged) return;
					e.preventDefault();
					e.stopPropagation();
					header.classList.remove("dragover");
					header.parentNode.insertBefore(dragged, header.nextSibling);
				});
			}
		});

		function syncSectionAttrs() {
			list.querySelectorAll(".section-group").forEach(function(group) {
				var sid = group.getAttribute("data-section-id");
				group.querySelectorAll(".item-row").forEach(function(row) {
					row.setAttribute("data-section", sid);
				});
			});
		}

		function saveOrder() {
			var groups = [];
			list.querySelectorAll(".section-group").forEach(function(group) {
				var sid = group.getAttribute("data-section-id");
				var ids = [];
				group.querySelectorAll(".item-row").forEach(function(row) {
					ids.push(row.getAttribute("data-id"));
				});
				groups.push({ section: sid, ids: ids });
			});
			status.innerText = "Saving order...";
			fetch("/savequestionsorder", {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify({ groups: groups })
			}).then(function(r) { return r.json(); }).then(function(data) {
				status.innerText = data.success ? "Order saved." : "Save failed.";
			}).catch(function() {
				status.innerText = "Save failed.";
			});
		}

		buildTagbar();
		applyFilter();
		applyCollapsed();
	</script>
</html>
